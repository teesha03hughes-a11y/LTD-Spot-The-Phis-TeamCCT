<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spot the Phish — Inbox Challenge</title><style>
:root{font-family:Arial,sans-serif;color:#132945;background:#edf3f9}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #04adc8;outline-offset:3px}button:disabled{cursor:default;opacity:.5}.app{display:grid;grid-template-columns:225px 1fr;min-height:100vh}aside{background:#102841;color:white;padding:28px 18px;display:flex;flex-direction:column;gap:12px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:25px;margin-bottom:35px}.logo{font-size:42px;color:#24c3d5}nav button{display:block;width:100%;border:0;background:none;color:#c7d7e8;text-align:left;padding:16px;border-radius:10px;margin-bottom:8px}nav button.active{background:#14637d;color:white}.status{margin-top:auto;border:1px solid #456078;padding:18px;border-radius:14px;line-height:1.9}.status strong{font-size:26px}progress{width:100%;accent-color:#20bed0}main{padding:30px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}h1{font-size:38px;margin:0 0 8px;letter-spacing:-1px}header p{margin:0;color:#536b83}.reset{background:white;border:1px solid #c7d7e5;padding:11px 16px;border-radius:8px}.workspace{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(340px,1.3fr);gap:18px}.panel{background:white;border:1px solid #d7e3ef;border-radius:14px;overflow:hidden}.list-head{padding:22px;border-bottom:1px solid #dce5ed;display:flex;justify-content:space-between;align-items:center}.list-head h2{font-size:20px;margin:0}.muted{color:#62788f;font-size:13px}.email{display:flex;gap:13px;align-items:center;width:100%;border:0;border-bottom:1px solid #e0e9f1;background:white;text-align:left;padding:20px 17px;color:#132945}.email:hover{background:#f0f8fc}.email.selected{background:#dff0fc;border-left:4px solid #08a9c5;padding-left:13px}.avatar{flex-shrink:0;width:42px;height:42px;border-radius:50%;background:#1975c9;color:white;display:grid;place-items:center;font-size:14px;font-weight:bold}.email:nth-child(3n) .avatar{background:#348d79}.email:nth-child(3n+1) .avatar{background:#7953b9}.email-text{min-width:0;flex:1}.sender-line{display:flex;justify-content:space-between;gap:8px}.sender-line b{font-size:14px}.subject{font-size:14px;line-height:1.5;margin-top:4px}.snippet{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:#677e95;margin-top:3px}.actions{display:flex;gap:12px;padding:18px;background:#f6faff;border-bottom:1px solid #dce7ef}.actions button{flex:1;border-radius:8px;padding:15px 10px;font-weight:bold}.report{background:#ffbf47;border:1px solid #e4a323;color:#222}.safe{background:white;border:1px solid #2460a5;color:#245b98}.message{padding:28px}.message h2{font-size:24px;line-height:1.3;margin:0 0 22px}.from{padding-bottom:23px;border-bottom:1px solid #e3eaf0;line-height:1.8;font-size:14px;overflow-wrap:anywhere}.address{color:#52708d}.body{font-size:16px;line-height:1.8;padding:26px 0;min-height:245px;white-space:pre-line}.fake-link{display:inline-block;color:#125f9e;border:1px solid #b8d3e8;background:#eff8ff;border-radius:7px;padding:10px 18px;font-weight:bold;cursor:help}.link-destination{font-size:12px;display:block;color:#536c83;overflow-wrap:anywhere;margin-top:8px}.hint{background:#edf6fc;padding:16px;color:#41617e;font-size:13px}.feedback{margin-top:24px;padding:20px;border-radius:10px;line-height:1.6;background:#e8f6ef;border:1px solid #aedac0}.feedback.wrong{background:#fff2e7;border-color:#f1c695}.feedback h3{margin:0 0 8px}.feedback p{margin:7px 0}.next{margin-top:12px;background:#164f7c;color:white;border:0;border-radius:7px;padding:11px 18px}.completion{padding:20px;background:#e8f7fa;border:1px solid #a1d6dd;border-radius:12px;margin-bottom:18px}.completion h2{margin:0 0 8px}.help{padding:32px;line-height:1.8}.help h2{margin-top:0}.empty{padding:40px;color:#536b83}footer{margin-top:18px;color:#62788f;font-size:12px}@media(max-width:1050px){.app{grid-template-columns:180px 1fr}main{padding:20px}.workspace{grid-template-columns:1fr}.email{padding:14px}.message{padding:22px}h1{font-size:30px}.status{margin-top:25px}}@media(max-width:600px){.app{display:block}aside{padding:15px;gap:8px}.brand{margin:0;font-size:22px}.logo{font-size:30px}nav{display:flex}nav button{margin:0;padding:10px}.status{margin:0;padding:10px 15px;font-size:13px}.status strong{font-size:18px}.status progress{max-width:120px;margin-left:12px}main{padding:16px}header{align-items:flex-start}h1{font-size:28px}header p{font-size:13px;line-height:1.5}.reset{font-size:12px} .actions{padding:12px;gap:8px}.actions button{font-size:13px}.message h2{font-size:21px}}
</style></head><body><div class="app"><aside><div class="brand"><span class="logo" aria-hidden="true">✉⌁</span><span>Spot the<br>Phish</span></div><nav aria-label="Folders"><button id="inboxNav" class="active" onclick="setFolder('inbox')">✉ &nbsp; Inbox <span id="count"></span></button><button id="reportedNav" onclick="setFolder('reported')">⚑ &nbsp; Reported</button><button id="helpNav" onclick="setFolder('help')">ⓘ &nbsp; How to play</button></nav><div class="status">🏆 &nbsp; Game status<br><strong id="score">0 points</strong><br><span id="progressText">Reviewed: 0/8</span><br><progress id="progress" value="0" max="8" aria-label="Emails reviewed"></progress></div></aside><main><header><div><h1>Spot the Phish</h1><p>Check your inbox. Spot the warning signs. Report suspicious emails.</p></div><button class="reset" onclick="restart()">↻ Restart</button></header><div id="completion" role="status"></div><div id="game"></div><footer>Training simulation · All messages and addresses are fictional. No email links or attachments open.</footer></main></div><script>
// Each object in this array stores an email and its answer.
const emails=[
{sender:'Campus Library',address:'library@university.example',subject:'Your reserved book is ready',time:'10:24',body:'Hi Alex,\n\nThe book you reserved, Introduction to Cybersecurity, is ready to collect from the library desk. Please bring your student card. We will hold it until Friday.\n\nBest wishes,\nCampus Library',phish:false,why:'This is an expected collection notice. It asks you to visit the library with your student card and does not request passwords, payment or an unusual action. If unsure, check your library account independently.'},
{sender:'IT Support',address:'helpdesk@campus-account-check.example',subject:'Urgent: verify your account today',time:'09:41',body:'Dear student,\n\nWe could not verify your university account. To prevent access being suspended, please confirm your login details within 24 hours.\n\nThank you,\nIT Support',link:'Verify account',url:'https://campus-account-check.example/login',phish:true,why:'The sender uses a lookalike domain rather than the university domain. The threat of suspension creates urgency, and the message asks you to submit login details through an unfamiliar link. Contact IT through a known channel.'},
{sender:'Connor',address:'connor@university.example',subject:'Group project meeting — Thursday',time:'09:15',body:'Hi Alex,\n\nAre we still on for Thursday’s meeting? I have finished my section of the mind map. Shall we meet in the library at 2pm to put everything together?\n\nThanks,\nConnor',phish:false,why:'This message fits an ongoing group project and asks a routine question. It contains no links, payment demands or requests for sensitive information. Familiar names alone are not proof, so check unexpected requests separately.'},
{sender:'Parcel Updates',address:'tracking@parcel-redelivery-fee.example',subject:'Delivery failed — action required',time:'08:52',body:'Your parcel could not be delivered.\n\nPay a redelivery fee of £1.49 within 12 hours or your parcel will be returned to the sender. Enter your card details using the link below.\n\nDelivery Team',link:'Pay redelivery fee',url:'https://parcel-redelivery-fee.example/payment',phish:true,why:'An unexpected payment request, a short deadline and an unfamiliar delivery domain are warning signs. A small fee can be a way to steal card details. Check the courier’s official app or website independently.'},
{sender:'Students’ Union',address:'events@university.example',subject:'This week on campus',time:'08:17',body:'Hello everyone,\n\nOur societies fair is taking place in the main hall on Wednesday from 12–3pm. Drop in to meet the teams, find a new hobby and see what is happening on campus.\n\nNo booking needed.\nStudents’ Union',phish:false,why:'This is a routine campus announcement with a location and time. It does not ask for credentials or money. A plausible message still deserves a sender check, especially if it includes unexpected requests.'},
{sender:'Accounts Team',address:'accounts@university-payments.example',subject:'Invoice attached — enable content',time:'Yesterday',body:'Dear student,\n\nAn unpaid tuition invoice is attached. Open the document and select “Enable Content” to view the amount due. Failure to pay today will result in a penalty.\n\nAccounts Team',attachment:'Tuition_Invoice.docm',phish:true,why:'The message pressures you to act immediately and asks you to enable active content in a macro-enabled document (.docm). That can run malicious code. Its sender domain also differs from the university domain. Verify the invoice through the official student portal.'},
{sender:'Course Tutor',address:'tutor@university.example',subject:'Lecture notes now available',time:'Yesterday',body:'Hi everyone,\n\nThe notes for this week’s lecture are now available on Moodle. Please sign in using your usual saved bookmark and read chapter three before our next session.\n\nSee you next week,\nYour course tutor',phish:false,why:'The message refers to normal course activity and directs you to use your existing Moodle bookmark instead of a supplied login link. There are no unusual demands or requests for confidential details.'},
{sender:'Cafe Rewards',address:'rewards@free-coffee-prize.example',subject:'You won! Claim your £100 voucher',time:'Monday',body:'CONGRATULATIONS!\n\nYour email has been selected for a £100 coffee voucher. To claim your prize, confirm your email password and pay a £2 processing fee in the next hour.\n\nDo not miss out!',link:'Claim my voucher',url:'https://free-coffee-prize.example/claim',phish:true,why:'An unexpected prize, a processing fee and a one-hour deadline are suspicious. A café has no reason to ask for your email password. Never provide account credentials to claim a reward.'}
];
let selected=1,folder='inbox',answers={};
const game=document.getElementById('game');
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setFolder(value){folder=value;render();}
function selectEmail(index){selected=index;render();}
// A reviewed email cannot be scored twice.
function classify(isPhishing){if(answers[selected]!==undefined)return;answers[selected]=isPhishing;render();}
function nextEmail(){const next=emails.findIndex((e,i)=>answers[i]===undefined);if(next>=0){selected=next;folder='inbox';render();}}
function restart(){if(Object.keys(answers).length&&!confirm('Restart the game and clear your score?'))return;answers={};selected=1;folder='inbox';render();}
function render(){
const reviewed=Object.keys(answers).length;
const correct=emails.reduce((total,e,i)=>total+(answers[i]!==undefined&&answers[i]===e.phish?1:0),0);
document.getElementById('score').textContent=correct*10+' points';
document.getElementById('progressText').textContent=`Reviewed: ${reviewed}/${emails.length}`;
document.getElementById('progress').value=reviewed;
document.getElementById('count').textContent=`(${emails.length-reviewed})`;
['inbox','reported','help'].forEach(f=>document.getElementById(f+'Nav').classList.toggle('active',f===folder));
document.getElementById('completion').innerHTML=reviewed===emails.length?`<section class="completion"><h2>Challenge complete! ${correct}/${emails.length} correct</h2><div>You earned ${correct*10} out of 80 points. ${correct===8?'Excellent detective work!':'Review your answers below to learn the warning signs.'} Use Restart for another attempt.</div></section>`:'';
if(folder==='help'){game.innerHTML='<section class="panel help"><h2>How to play</h2><p>Your inbox contains eight fictional emails. Read each message and decide whether to <b>Report phishing</b> or <b>Mark as safe</b>. Each correct answer earns 10 points.</p><ol><li>Check the full sender address, not just the display name.</li><li>Watch for pressure, unexpected prizes and requests for passwords or payments.</li><li>Inspect the displayed link destination and attachment type.</li><li>Choose your answer, then read the explanation.</li></ol><p>Reported shows messages you reported, including any mistakes. Reviewed messages remain available in your inbox. In real life, verify uncertain messages through a known, trusted channel. A familiar address or polished writing does not guarantee safety.</p><button class="next" onclick="setFolder(\'inbox\')">Back to inbox</button></section>';return;}
const visible=emails.map((e,i)=>i).filter(i=>folder!=='reported'||answers[i]===true);
if(!visible.length){game.innerHTML='<section class="panel empty">No reported emails yet. Choose an email in your inbox and select Report phishing.</section>';return;}
if(!visible.includes(selected))selected=visible[0];
const e=emails[selected],answered=answers[selected]!==undefined,correctAnswer=answers[selected]===e.phish;
game.innerHTML=`<div class="workspace"><section class="panel" aria-label="Email list"><div class="list-head"><h2>${folder==='reported'?'Reported':'Inbox'} (${visible.length})</h2><span class="muted">Newest first</span></div>${visible.map(i=>{const m=emails[i];return `<button class="email ${i===selected?'selected':''}" onclick="selectEmail(${i})" aria-pressed="${i===selected}"><span class="avatar" aria-hidden="true">${m.sender.split(' ').map(w=>w[0]).slice(0,2).join('')}</span><span class="email-text"><span class="sender-line"><b>${escapeHTML(m.sender)}</b><span class="muted">${answers[i]!==undefined?'✓ Reviewed':m.time}</span></span><span class="subject">${escapeHTML(m.subject)}</span><span class="snippet" style="display:block">${escapeHTML(m.body.slice(0,70))}</span></span></button>`}).join('')}</section><section class="panel" aria-label="Selected email"><div class="actions"><button class="report" onclick="classify(true)" ${answered?'disabled':''}>⚑ &nbsp; Report phishing</button><button class="safe" onclick="classify(false)" ${answered?'disabled':''}>✓ &nbsp; Mark as safe</button></div><div class="message"><h2>${escapeHTML(e.subject)}</h2><div class="from"><b>${escapeHTML(e.sender)}</b><br><span class="address">&lt;${escapeHTML(e.address)}&gt;<br>To: alex@university.example · ${e.time}</span></div><div class="body">${escapeHTML(e.body)}</div>${e.link?`<span class="fake-link" title="Training link — cannot be opened">${escapeHTML(e.link)}</span><span class="link-destination">Link destination: ${escapeHTML(e.url)}</span>`:''}${e.attachment?`<span class="fake-link">▤ ${escapeHTML(e.attachment)}</span><span class="link-destination">Simulated attachment — cannot be opened</span>`:''}<div id="feedback" aria-live="polite">${answered?`<div class="feedback ${correctAnswer?'':'wrong'}"><h3>${correctAnswer?'✓ Correct! +10 points':'That one caught you out'}</h3><p>This email is <b>${e.phish?'phishing':'safe in this scenario'}</b>. You chose to ${answers[selected]?'report it':'mark it as safe'}.</p><p>${escapeHTML(e.why)}</p>${reviewed<emails.length?'<button class="next" onclick="nextEmail()">Next unreviewed email →</button>':''}</div>`:''}</div></div><div class="hint">ⓘ Review the sender, message and link destination before choosing. All links are simulated.</div></section></div>`;
}
render();
</script></body></html>
